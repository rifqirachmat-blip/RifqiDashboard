<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Data Loss</title>

    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/data-loss.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- HEADER -->

<div class="page-header">

    <div>

        <h2>📉 Data Loss</h2>

        <small>Store Stock Loss Detail</small>

    </div>

</div>

<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="searchLoss"
        placeholder="🔍 Search Store..."
        autocomplete="off">

    <div id="lossSuggestion" class="suggestion-box"></div>

</div>

<!-- LOADING -->

<div id="loadingLoss" style="display:none">

    Loading...

</div>

<!-- CONTENT -->

<div id="lossContent">

    <div class="table-box">

        <div style="
            padding:60px;
            text-align:center;
            color:#777;
        ">

            🔍 Cari Store terlebih dahulu

        </div>

    </div>

</div>

<script src="js/data-loss.js"></script>

</body>

</html>
