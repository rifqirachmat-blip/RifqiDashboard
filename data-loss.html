<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Data Loss</title>
    <link rel="icon" type="image/png" href="assets/icons/logo3.png?v=2">
    <!-- Global -->
    <link rel="stylesheet"
          href="css/style.css">

    <!-- Khusus -->
    <link rel="stylesheet"
          href="css/data-loss.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===================================== -->
<!-- SIDEBAR -->
<!-- ===================================== -->

<div class="sidebar">

    <div class="logo">

        <h2>BM Rifqi DR</h2>

        <span>Performance Dashboard</span>

    </div>

    <ul>

        <li onclick="location.href='index.html'">

            <i class="fa-solid fa-chart-column"></i>

            Dashboard Sales KPI

        </li>

        <li onclick="location.href='mtd.html'">

            <i class="fa-solid fa-chart-line"></i>

            Sales Month To Date

        </li>

        <li onclick="location.href='stockloss.html'">

            <i class="fa-solid fa-boxes-stacked"></i>

            Stock Take Center

        </li>

        <li class="active">

            <i class="fa-solid fa-chart-line"></i>

            Data Loss

        </li>

        <li onclick="location.href='manpower.html'">

            <i class="fa-solid fa-users"></i>

            Data Manpower

        </li>

        <li onclick="location.href='keepstock.html'">

            <i class="fa-solid fa-store"></i>

            Monitoring Keepstock

        </li>
        <li onclick="location.href='tools.html'">

    <i class="fa-solid fa-screwdriver-wrench"></i>

    Tools

</li>
        


    </ul>

</div>

<!-- ===================================== -->
<!-- MAIN -->
<!-- ===================================== -->

<div class="main">

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>📉 Data Loss</h1>

            <p>Store Stock Loss Detail</p>

        </div>

        <div class="today">

            <div class="today-icon">

                <i class="fa-solid fa-calendar-days"></i>

            </div>

            <div class="today-info">

                <span id="todayDate"></span>

                <small id="todayTime"></small>

            </div>

        </div>

    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="searchLoss"
            type="text"
            placeholder="🔍 Search Store..."
            autocomplete="off">

        <div
            id="lossSuggestion"
            class="suggestion-box">

        </div>

    </div>

    <!-- CONTENT -->

    <div id="lossContent">

        <div class="table-box">

            <div class="empty-box">

                🔍 Cari Store terlebih dahulu

            </div>

        </div>

    </div>

</div>

<!-- ===================================== -->
<!-- LOADING -->
<!-- ===================================== -->

<div
    id="loadingOverlay"
    class="loading-overlay">

    <div class="loading-card">

        <div class="spinner"></div>

        <p>Kela euy...</p>

    </div>

</div>

<!-- JS -->

<script src="js/helper.js"></script>
<script src="js/data-loss.js"></script>
