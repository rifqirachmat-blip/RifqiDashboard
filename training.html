<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Monitoring Training</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/training.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<!-- =========================
SIDEBAR
========================= -->

<div class="sidebar">

    <!-- gunakan sidebar project kamu -->

</div>

<!-- =========================
MAIN
========================= -->

<div class="main">

    <!-- HEADER -->

    <div class="header">

        <div>

            <h1>🎓 Monitoring Training</h1>

            <p>Employee Training Schedule</p>

        </div>

        <div class="today">

            <div class="today-icon">

                <i class="fa-solid fa-calendar-days"></i>

            </div>

            <div class="today-info">

                <span id="todayDate"></span>

                <small id="todayTime"></small>

            </div>

        </div>

    </div>

    <!-- TAB -->

    <div class="training-tabs">

        <button
            id="btnToday"
            class="tab-btn active">

            <i class="fa-solid fa-calendar-day"></i>

            Today Training

        </button>

        <button
            id="btnAll"
            class="tab-btn">

            <i class="fa-solid fa-calendar-week"></i>

            Full Training Schedule

        </button>

    </div>

    <!-- KPI SUPERIOR -->

    <div
        class="cards"
        id="superiorKPI">

    </div>

    <!-- SEARCH -->

    <div class="search-box">

        <input

            id="searchTraining"

            type="text"

            placeholder="🔍 Search Employee / Store / Training"

        >

    </div>

    <!-- CONTENT -->

    <div id="trainingContent">

    </div>

</div>

<!-- =========================
LOADING
========================= -->

<div
id="loadingOverlay"
class="loading-overlay">

    <div class="loading-card">

        <div class="spinner"></div>

        <p>Loading...</p>

    </div>

</div>

<script src="js/helper.js"></script>
<script src="js/training.js"></script>

</body>
</html>
